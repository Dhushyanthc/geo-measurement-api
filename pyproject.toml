[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-measurement-api"
version = "0.1.0"
description = "Upload KML or zipped Shapefiles and get per-feature area and length measurements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pyogrio>=0.7",
    "shapely>=2.1",
    "pyproj>=3.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "pyshp>=2.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside pyogrio's reader on numpy >= 2.5, not by this project's code.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:pyogrio",
    # Starlette 1.x nudges TestClient users towards httpx2; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
